name: Markdown

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24

  length:
    name: Max 300 lines per file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bin/check-md-length
